<script>
  /**
   * =================================================================
   * 1. グローバル変数・状態管理 (GLOBAL STATE)
   * =================================================================
   */
  let currentUser = null;
  let currentSession = null;
  let currentPhase = 'BEFORE'; // 授業フェーズ: BEFORE(導入), AFTER(展開/まとめ)
  let scatterChart = null;     // 教師用: 散布図チャートインスタンス
  let loadingTimeout = null;   // 読み込み監視用タイマー
  let isPageVisible = true;    // ブラウザタブの表示状態（ポーリング制御用）
  let isAutoLogin = false;     // メールアドレス自動ログインフラグ

  // Google Drive Picker State
  let pickerModal = null;
  let currentPickerFolderId = null;
  let parentPickerFolderId = null;


  /**
   * =================================================================
   * 2. アプリ初期化・ライフサイクル (INITIALIZATION)
   * =================================================================
   */
  document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) {
      // タブがアクティブになったら即座に状態チェック
      if (localStorage.getItem('isTeacher') !== 'true') {
        checkPhaseUpdate();
      }
    }
  });
  document.addEventListener('DOMContentLoaded', () => {
    // 1. セーフティネット
    loadingTimeout = setTimeout(() => {
      const loader = document.getElementById('loading');
      if (loader && !loader.classList.contains('d-none')) {
        loader.innerHTML = `
        <div class="alert alert-warning">
          <p>読み込みに時間がかかっています。</p>
          <button class="btn btn-sm btn-outline-dark" onclick="resetApp()">再読み込み</button>
        </div>`;
      }
    }, 15000);

    // アプリフロー開始
    initAppFlow();

    // ポーリング開始 (5秒間隔)
    setInterval(() => {
      if (!isPageVisible) return; // タブ非表示時は停止
      checkPhaseUpdate();
    }, 5000);
  });

  /**
   * UI Helpers
   */
  function updateCharCount(textarea, counterId) {
    const counter = document.getElementById(counterId);
    if (counter) {
      const len = textarea.value.length;
      const max = textarea.maxLength || 500;
      counter.textContent = `${len} / ${max}`;
      counter.classList.toggle('text-danger', len >= max);
    }
  }

  /**
   * UI Logic (Safe Transition)
   */
  function showView(viewId) {
    // すべてのビューを隠す
    const allViews = document.querySelectorAll('[id^="view-"]');
    allViews.forEach(el => el.classList.add('d-none'));

    // 指定されたビューを表示
    const target = document.getElementById(viewId);
    if (target) {
      target.classList.remove('d-none');
      target.classList.add('fade-in');
    } else {
      // 万が一IDが間違っていたら待機画面を出す（ホワイトアウト防止）
      console.warn(`View ID "${viewId}" not found. Fallback to waiting.`);
      const fallback = document.getElementById('view-waiting');
      if (fallback) fallback.classList.remove('d-none');
    }
  }

  /**
   * =================================================================
   * 4. 生徒用機能 (STUDENT FUNCTIONS)
   * =================================================================
   */
  function login(autoUid) {
    let uid = autoUid;
    if (!uid) {
      const select = document.getElementById('student-select');
      uid = select.value;
      if (!uid) {
        Swal.fire('名前を選んでね', '', 'warning');
        return;
      }
    }

    localStorage.setItem('studentId', uid);
    currentUser = { id: uid };

    // 自動ログイン時は「名前を変える」リンクを非表示
    const btnLogout = document.getElementById('btn-logout-student');
    if (btnLogout) {
      btnLogout.classList.toggle('d-none', isAutoLogin);
    }

    // 授業有無で分岐
    if (currentSession) {
      if (currentPhase === 'AFTER') {
        showReflectionView();
      } else {
        showView('view-entry');
      }
    } else {
      showView('view-waiting');
    }
  }

  function setupSessionUI(session) {
    const titleEl = document.getElementById('session-title');
    if (titleEl) titleEl.innerText = session.title;

    // PatternRendererによる動的描画
    const container = document.getElementById('pattern-ui-container');
    if (!container) {
      console.error('pattern-ui-container not found');
      return;
    }

    // オプションのパース
    let opts = {};
    try {
      opts = typeof session.options === 'string' ? JSON.parse(session.options) : session.options;
    } catch (e) {
      console.error('Failed to parse options', e);
    }

    // Render
    patternRenderer.render(session.inputType, container, opts, 'INPUT');

    // 背景色調整等のためのコールバック的な処理が必要ならここで行う
    // 例: Sliderの場合の背景色同期など (PatternRenderer内で完結させるのが理想だが、互換性維持のため)
    if (session.inputType === 'SLIDER') {
      const slider = document.getElementById('pattern-slider');
      if (slider) {
        // 初期カラー設定のロジック再利用 (IDが変わったので注意)
        // patternRenderer.renderSlider で oninput に埋め込んでいるので、基本は不要だが
        // 初期表示時の色設定が必要なら dispatchEvent する
        slider.dispatchEvent(new Event('input'));
      }
    }
  }

  // updateSliderColor, selectTag は PatternRenderer に移行済みのため削除

  /**
   * Action: 送信
   */
  /**
   * Fullscreen Opinion View
   */
  function showOpinionFullscreen() {
    const overlay = document.getElementById('fullscreen-opinions');
    if (!overlay) return;
    overlay.classList.remove('d-none');

    const content = document.getElementById('fullscreen-opinion-content');
    content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-3 text-muted fs-5">読み込み中...</p></div>';

    loadClassOpinionsFullscreen();
  }

  function closeOpinionFullscreen() {
    const overlay = document.getElementById('fullscreen-opinions');
    if (overlay) overlay.classList.add('d-none');
  }

  /**
   * Dialogue Mode (対話モード)
   * 全パターン対応: 回答に基づいた色で画面を染め、教室内で色の違う友達を探せるようにする
   */
  function getDialogueColor(patternType, value, options) {
    let opts = {};
    try {
      opts = typeof options === 'string' ? JSON.parse(options) : (options || {});
    } catch (e) { }

    switch (patternType) {
      case 'SLIDER': {
        // 0=青(210°), 50=緑(105°), 100=赤(0°) の連続グラデーション
        const v = Number(value) || 50;
        const hue = 210 - (v / 100) * 210;
        return `hsl(${hue}, 80%, 48%)`;
      }
      case 'TAGS': {
        // タグごとに鮮やかな固定色
        const tagColors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22'];
        const tags = opts.tags || [];
        const idx = tags.indexOf(String(value));
        return tagColors[idx >= 0 ? idx % tagColors.length : Math.abs(String(value).split('').reduce((h, c) => ((h << 5) - h) + c.charCodeAt(0), 0)) % tagColors.length];
      }
      case 'QUADRANT': {
        // 4象限で明確に異なる色（位置の強さで彩度変化）
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const x = Number(val?.x) || 0;
        const y = Number(val?.y) || 0;
        const dist = Math.min(Math.sqrt(x * x + y * y) / 100, 1);
        const sat = 55 + dist * 35;
        if (x >= 0 && y >= 0) return `hsl(350, ${sat}%, 50%)`; // 右上: 赤
        if (x < 0 && y >= 0) return `hsl(210, ${sat}%, 48%)`;  // 左上: 青
        if (x < 0 && y < 0) return `hsl(145, ${sat}%, 42%)`;   // 左下: 緑
        return `hsl(40, ${sat}%, 50%)`;                          // 右下: 橙
      }
      case 'RANKING': {
        // 1位に選んだ項目ごとに固定色
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const top = val?.items?.[0] || '';
        const items = opts.items || [];
        const idx = items.indexOf(top);
        const rankColors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];
        return rankColors[idx >= 0 ? idx % rankColors.length : 0];
      }
      case 'CURVE': {
        // 曲線全体の平均値でグラデーション（低=青, 高=赤）
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        if (val?.data && val.data.length > 0) {
          const avg = val.data.reduce((s, d) => s + d.value, 0) / val.data.length;
          const hue = 210 - (avg / 100) * 210;
          return `hsl(${hue}, 80%, 48%)`;
        }
        return '#6c757d';
      }
      case 'MANDALA': {
        // 埋めた数でグラデーション（少ない=青, 多い=赤）
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const count = val?.items ? val.items.filter(v => v && v.trim()).length : 0;
        const hue = 210 - (count / 8) * 210;
        return `hsl(${hue}, 75%, 48%)`;
      }
      case 'ACTION': {
        return '#27ae60';
      }
      default:
        return '#6c757d';
    }
  }

  function getDialogueLabel(patternType, value, options) {
    let opts = {};
    try {
      opts = typeof options === 'string' ? JSON.parse(options) : (options || {});
    } catch (e) { }

    const badge = (text) => `<span class="badge bg-white bg-opacity-25 fs-4 px-4 py-2 shadow-sm">${text}</span>`;

    switch (patternType) {
      case 'SLIDER': {
        const v = Number(value) || 50;
        const minL = opts.minLabel || 'A';
        const maxL = opts.maxLabel || 'B';
        return badge(`${v} / 100`) + `<div class="mt-2 small" style="opacity:0.8;">${minL} ← → ${maxL}</div>`;
      }
      case 'TAGS':
        return badge(value);
      case 'QUADRANT': {
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const xL = opts.xAxisLabel || ['左', '右'];
        const yL = opts.yAxisLabel || ['下', '上'];
        const x = val?.x || 0;
        const y = val?.y || 0;
        const xDir = x >= 0 ? xL[1] : xL[0];
        const yDir = y >= 0 ? yL[1] : yL[0];
        return badge(`${yDir}・${xDir}`);
      }
      case 'RANKING': {
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const top = val?.items?.[0] || '-';
        return badge(`1位: ${top}`);
      }
      case 'CURVE':
        return badge('心情曲線');
      case 'MANDALA': {
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        const count = val?.items ? val.items.filter(v => v && v.trim()).length : 0;
        return badge(`${count}個のキーワード`);
      }
      case 'ACTION': {
        let val = value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        return badge(val?.what || '行動宣言');
      }
      default:
        return badge(String(value));
    }
  }

  function showDialogueMode(value) {
    if (!currentSession) return;

    const color = getDialogueColor(currentSession.inputType, value, currentSession.options);
    const label = getDialogueLabel(currentSession.inputType, value, currentSession.options);

    const card = document.getElementById('dialogue-mode-card');
    const beacon = document.getElementById('dialogue-beacon');
    const valueDisplay = document.getElementById('dialogue-value-display');

    if (card) {
      card.classList.remove('d-none');
      card.dataset.color = color;
      card.dataset.label = label;
    }
    if (beacon) beacon.style.background = color;
    if (valueDisplay) valueDisplay.innerHTML = label;
  }

  function toggleDialogueFullscreen() {
    const card = document.getElementById('dialogue-mode-card');
    const fsOverlay = document.getElementById('dialogue-fullscreen');
    const fsBeacon = document.getElementById('dialogue-fs-beacon');
    const fsValue = document.getElementById('dialogue-fs-value');

    if (!card || !fsOverlay) return;

    fsBeacon.style.background = card.dataset.color || '#6c757d';
    if (fsValue) fsValue.innerHTML = card.dataset.label || '';
    fsOverlay.classList.remove('d-none');
  }

  function closeDialogueFullscreen() {
    const fsOverlay = document.getElementById('dialogue-fullscreen');
    if (fsOverlay) fsOverlay.classList.add('d-none');
  }

  function loadClassOpinionsFullscreen() {
    if (!currentSession) return;

    const content = document.getElementById('fullscreen-opinion-content');

    runGoogleScript('getAnonymousOpinions', currentSession.id)
      .then(opinions => {
        if (!opinions || opinions.length === 0) {
          content.innerHTML = '<div class="text-center text-muted fs-4 py-5"><i class="bi bi-chat-dots d-block fs-1 mb-3"></i>まだ意見がありません</div>';
          return;
        }

        // 現在のフェーズでフィルタ
        const filtered = opinions.filter(o => o.phase === currentPhase);

        if (filtered.length === 0) {
          content.innerHTML = '<div class="text-center text-muted fs-4 py-5"><i class="bi bi-chat-dots d-block fs-1 mb-3"></i>この場面の意見はまだありません</div>';
          return;
        }

        // オプションをパース
        let opts = {};
        try {
          opts = typeof currentSession.options === 'string' ? JSON.parse(currentSession.options) : (currentSession.options || {});
        } catch (e) { }

        // フルスクリーン最適化表示
        patternRenderer.renderOpinionListFullscreen(currentSession.inputType, content, filtered, opts);
      })
      .catch(err => {
        content.innerHTML = '<div class="text-center text-danger fs-5 py-5"><i class="bi bi-exclamation-triangle d-block fs-1 mb-3"></i>読み込みに失敗しました</div>';
      });
  }

  let isSubmitting = false; // 二重送信防止フラグ

  function submitOpinion() {
    if (!currentUser || !currentSession) return;
    if (isSubmitting) return; // 二重送信防止

    const text = document.getElementById('input-text').value;

    // PatternRendererから値を統一取得
    const val = patternRenderer.getValue();

    if (val === null || val === undefined || val === '') {
      Swal.fire('入力を確認してね', '', 'warning');
      return;
    }

    const payload = {
      sessionId: currentSession.id,
      studentId: currentUser.id,
      phase: currentPhase,
      value: (typeof val === 'object') ? JSON.stringify(val) : val,
      text: text
    };

    // ボタン無効化
    isSubmitting = true;
    const submitBtn = document.querySelector('#view-entry .btn-primary[onclick="submitOpinion()"]');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> 送信中...';
    }

    runGoogleScript('submitLog', payload)
      .then((result) => {
        if (result && !result.success && result.duplicate) {
          Swal.fire({ icon: 'info', title: 'もう送信済みだよ', text: '友達の意見を見てみよう', timer: 2000, showConfirmButton: false });
        } else if (result && !result.success) {
          Swal.fire({ icon: 'error', title: 'エラー', text: result.error });
          // エラー時はボタンを復活
          isSubmitting = false;
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-send-fill me-2"></i> 送信する';
          }
          return;
        } else {
          Swal.fire({
            icon: 'success',
            title: '送りました！',
            text: '友達の意見も見てみよう',
            timer: 1500,
            showConfirmButton: false
          });
        }

        // 送信成功後の処理
        showDialogueMode(val);

        const btnOpinion = document.getElementById('btn-opinion-share');
        if (btnOpinion) btnOpinion.classList.remove('d-none');

        // 送信ボタンを「送信済み」状態に
        if (submitBtn) {
          submitBtn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> 送信済み';
          submitBtn.classList.remove('btn-primary');
          submitBtn.classList.add('btn-secondary');
        }

        document.getElementById('input-text').value = '';

        // AIフィードバック
        document.getElementById('ai-feedback-card').classList.add('d-none');
        if (currentSession) {
          requestAiFeedback(currentSession.title, text, currentSession.inputType, val);
        }
      })
      .catch(err => {
        isSubmitting = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-send-fill me-2"></i> 送信する';
        }
        showError(err);
      });
  }

  /**
   * Teacher Functions
   */
  function logoutTeacher() {
    localStorage.removeItem('isTeacher');
    resetApp();
  }

  function logoutStudent() {
    if (isAutoLogin) {
      Swal.fire('自動ログイン中', 'Googleアカウントで自動ログインしているため、名前を変更できません。', 'info');
      return;
    }
    localStorage.removeItem('studentId');
    currentUser = null;
    showView('view-login');
  }


  function toggleTeacherMode() {
    const isT = localStorage.getItem('isTeacher') === 'true';
    if (isT) {
      if (confirm('先生モードを終了しますか？')) {
        logoutTeacher();
      }
    } else {
      // サーバーサイド認証（試行回数制限付き）
      Swal.fire({
        title: '先生用パスワード',
        input: 'password',
        inputAttributes: { autocapitalize: 'off' },
        showCancelButton: true,
        confirmButtonText: 'ログイン',
        showLoaderOnConfirm: true,
        preConfirm: (pass) => {
          return runGoogleScript('checkTeacherPassword', pass)
            .then(result => {
              // パスワード未設定のときは、そのまま初回設定の画面に進みます
              if (result.needsSetup) return result;
              if (!result.success) {
                throw new Error(result.error || 'パスワードが違います');
              }
              return result;
            })
            .catch(error => {
              Swal.showValidationMessage(`${error}`);
            });
        },
        allowOutsideClick: () => !Swal.isLoading()
      }).then((result) => {
        if (result.isConfirmed) {
          const res = result.value || {};
          // パスワードが未設定の場合は、まず設定してもらう
          if (res.needsSetup) {
            promptPasswordChange('', true);
            return;
          }
          localStorage.setItem('isTeacher', 'true');
          if (res.requirePasswordChange) {
            promptPasswordChange('');
          } else {
            resetApp();
          }
        }
      })
    }
  }

  // ※パスワードは画面切替のためのものです。データを守っているのはサーバー側のメール照合です。
  function promptPasswordChange(currentPass, isFirstSetup) {
    Swal.fire({
      title: isFirstSetup ? '管理者パスワードを設定してください' : 'パスワードを変更してください',
      html: '<p class="small text-muted">' +
        (isFirstSetup
          ? 'まだ管理者パスワードが設定されていません。先生用の画面に入るためのパスワードを決めてください。'
          : 'セキュリティのため、パスワードを変更してください。') + '</p>' +
        '<input type="password" id="swal-new-pass" class="swal2-input" placeholder="新しいパスワード（4文字以上）">' +
        '<input type="password" id="swal-new-pass-confirm" class="swal2-input" placeholder="もう一度入力">',
      showCancelButton: true,
      confirmButtonText: '変更する',
      cancelButtonText: 'あとで変更',
      preConfirm: () => {
        const newPass = document.getElementById('swal-new-pass').value;
        const confirm = document.getElementById('swal-new-pass-confirm').value;
        if (!newPass || newPass.length < 4) {
          Swal.showValidationMessage('4文字以上で入力してください');
          return false;
        }
        if (newPass !== confirm) {
          Swal.showValidationMessage('パスワードが一致しません');
          return false;
        }
        return runGoogleScript('changeTeacherPassword', currentPass || '', newPass)
          .then(result => {
            if (!result.success) throw new Error(result.error);
            return true;
          })
          .catch(err => { Swal.showValidationMessage(String(err)); });
      }
    }).then((result) => {
      if (result.isConfirmed) {
        if (isFirstSetup) localStorage.setItem('isTeacher', 'true');
        Swal.fire({
          icon: 'success',
          title: isFirstSetup ? 'パスワードを設定しました' : 'パスワードを変更しました',
          timer: 1500,
          showConfirmButton: false
        });
      }
      resetApp();
    });
  }

  function toggleSessionOptions() {
    const type = document.getElementById('new-session-type').value;
    document.getElementById('session-opts-slider').classList.toggle('d-none', type !== 'SLIDER');
    document.getElementById('session-opts-tags').classList.toggle('d-none', type !== 'TAGS');
    document.getElementById('session-opts-quadrant').classList.toggle('d-none', type !== 'QUADRANT');
    document.getElementById('session-opts-mandala').classList.toggle('d-none', type !== 'MANDALA');
    document.getElementById('session-opts-ranking').classList.toggle('d-none', type !== 'RANKING');
    document.getElementById('session-opts-curve').classList.toggle('d-none', type !== 'CURVE');
  }

  /**
   * =================================================================
   * 3. 授業管理 (TEACHER SESSION CONTROL)
   * =================================================================
   */
  function createNewSession() {
    const title = document.getElementById('new-session-title').value;
    if (!title) { Swal.fire('タイトルを入れてね', '', 'warning'); return; }

    const type = document.getElementById('new-session-type').value;
    let options = {};

    if (type === 'SLIDER') {
      const minLabel = document.getElementById('opt-slider-min').value.trim() || '賛成';
      const maxLabel = document.getElementById('opt-slider-max').value.trim() || '反対';
      options = { minLabel: minLabel, maxLabel: maxLabel, tags: [] };
    } else if (type === 'TAGS') {
      const tagsStr = document.getElementById('opt-tags-list').value.trim();
      const tags = tagsStr ? tagsStr.split(/[,、，]/).map(t => t.trim()).filter(t => t) : ['共感', '疑問', '納得', '驚き'];
      options = { tags: tags };
    } else if (type === 'QUADRANT') {
      options = {
        xAxisLabel: [
          document.getElementById('opt-quad-xmin').value || '左',
          document.getElementById('opt-quad-xmax').value || '右'
        ],
        yAxisLabel: [
          document.getElementById('opt-quad-ymin').value || '下',
          document.getElementById('opt-quad-ymax').value || '上'
        ]
      };
    } else if (type === 'MANDALA') {
      options = {
        centerTheme: document.getElementById('opt-mandala-theme').value || 'テーマ'
      };
    } else if (type === 'RANKING') {
      const itemsStr = document.getElementById('opt-ranking-items').value.trim();
      const items = itemsStr ? itemsStr.split(/[,、，]/).map(t => t.trim()).filter(t => t) : ['項目A', '項目B', '項目C'];
      options = { items: items };
    } else if (type === 'CURVE') {
      const scenesStr = document.getElementById('opt-curve-scenes').value.trim();
      const scenes = scenesStr ? scenesStr.split(/[,、，]/).map(t => t.trim()).filter(t => t) : ['はじめ', '展開', '山場', '結末'];
      options = { scenes: scenes };

  function changePhase(newPhase) {
    if (!currentSession) {
      Swal.fire('授業が選択されていません', '', 'warning');
      return;

    if (newPhase === 'CLOSED') {
      Swal.fire({

              updatePhaseButtons('CLOSED');
              Swal.fire('授業を終了しました', '', 'success');
            })
            .catch(showError);
        }
      });
      return;
    }

    Swal.fire({ title: 'フェーズ変更中...', didOpen: () => Swal.showLoading() });

    runGoogleScript('updateSessionPhase', currentSession.id, newPhase)
      .then(result => {
        if (result && result.success) {
          currentSession.phase = newPhase;
          updatePhaseButtons(newPhase);
          Swal.fire({
            icon: 'success',
            title: 'フェーズ変更完了',
            text: newPhase === 'BEFORE' ? '導入フェーズです' : '振り返りフェーズです',

  function updatePhaseButtons(phase) {
    const phases = ['BEFORE', 'AFTER', 'CLOSED'];
    phases.forEach(p => {
      // Class Mode Buttons
      const btn = document.getElementById('btn-phase-' + p + '-class');
      if (!btn) return;

      if (p === phase) {
        btn.classList.remove('btn-outline-primary', 'btn-outline-danger');
        btn.classList.add(p === 'CLOSED' ? 'btn-danger' : 'btn-primary');
        btn.classList.remove('bg-white'); // Ensure active state is solid color
      } else {
        btn.classList.remove('btn-primary', 'btn-danger');
        btn.classList.add(p === 'CLOSED' ? 'btn-outline-danger' : 'btn-outline-primary');
        btn.classList.add('bg-white'); // Keep background white for outline
      }
    });

    const labels = { BEFORE: '導入（BEFORE）', AFTER: '振り返り（AFTER）', CLOSED: '終了' };
    const displayClass = document.getElementById('current-phase-display-class');
    if (displayClass) displayClass.innerText = labels[phase] || phase;
  }

      if (panel) panel.classList.toggle('d-none', mode !== m);
    });

    if (mode === 'history') {
      loadHistoryDropdowns();
    }
  }

  function submitReflection() {
    if (!currentUser || !currentSession) return;
    if (isSubmitting) return;

    const text = document.getElementById('reflection-text').value;
    const val = patternRenderer.getValue();

    if (val === null || val === '') {
      Swal.fire('入力を確認してね', '', 'warning');
      return;
    }

    const payload = {
      sessionId: currentSession.id,
      studentId: currentUser.id,
      phase: 'AFTER',
      value: (typeof val === 'object') ? JSON.stringify(val) : val,
      text: text
    };

    isSubmitting = true;
    const submitBtn = document.querySelector('#view-reflection .btn-success[onclick="submitReflection()"]');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> 送信中...';
    }

    runGoogleScript('submitLog', payload)
      .then((result) => {
        if (result && !result.success && result.duplicate) {
          Swal.fire({ icon: 'info', title: 'もう送信済みだよ', timer: 1500, showConfirmButton: false });
        } else if (result && !result.success) {
          Swal.fire({ icon: 'error', title: 'エラー', text: result.error });
          isSubmitting = false;
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-send-fill me-2"></i> 送信する';
          }
          return;
        } else {
          Swal.fire({
            icon: 'success',
            title: '振り返りを送りました！',
            timer: 1500,
            showConfirmButton: false
          });
        }
        showView('view-done');
      })
      .catch(err => {
        isSubmitting = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-send-fill me-2"></i> 送信する';
        }
        showError(err);
      });
  }

  /**
 * Student Phase Polling
 */
  function checkPhaseUpdate() {
    if (localStorage.getItem('isTeacher') === 'true') return;

    runGoogleScript('getPollingData')
      .then(data => {
        // 1. ケース: 待機中だったが、授業が始まった
        if (!currentSession && data.activeSession) {
          console.log('Session started! Reloading...');
          resetApp(); // アプリ再初期化で授業コンテキストを読み込む
          return;
        }

        // 2. ケース: 授業中だったが、授業が終わった (または消された)
        if (currentSession && !data.activeSession) {
          console.log('Session ended. Reloading...');
          resetApp(); // アプリ再初期化で待機画面へ
          return;
        }

        // 3. ケース: IDが変わった（別の授業になった）
        if (currentSession && data.activeSession && currentSession.id !== data.activeSession.id) {
          console.log('Session changed. Reloading...');
          resetApp();
          return;
        }

        // 4. ケース: フェーズが変わった
        if (currentSession && data.activeSession) {
          const serverPhase = data.activeSession.phase;
          if (serverPhase !== currentSession.phase) {
            console.log(`Phase changed: ${currentSession.phase} -> ${serverPhase}`);
            currentSession.phase = serverPhase;
            currentPhase = serverPhase;

            // UI更新
            const phaseLabels = { BEFORE: '今の考えを教えてね', AFTER: '振り返りの時間です' };
            const pLabel = document.getElementById('phase-label');
            if (pLabel) pLabel.innerText = phaseLabels[serverPhase] || serverPhase;

            updatePhaseButtons && updatePhaseButtons(serverPhase); // もし関数があれば

            // フルスクリーン表示を閉じる
            closeOpinionFullscreen();
            closeDialogueFullscreen();

            if (serverPhase === 'AFTER') {
              showReflectionView();
              Swal.fire({
                icon: 'info',
                title: '振り返りの時間です',
                text: '授業のまとめを入力しましょう',
                timer: 2000,
                showConfirmButton: false
              });
            } else {
              // BEFOREに戻った場合など
              showView('view-entry');
            }
          }
        }
      })
      .catch(() => { }); // ポーリングエラーは無視
  }

  function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function renderTagsTeacherView(beforeLogs, afterLogs) {
    const beforeCounts = {};
    const afterCounts = {};
    beforeLogs.forEach(l => { beforeCounts[l.value] = (beforeCounts[l.value] || 0) + 1; });
    afterLogs.forEach(l => { afterCounts[l.value] = (afterCounts[l.value] || 0) + 1; });

    const allTags = [...new Set([...Object.keys(beforeCounts), ...Object.keys(afterCounts)])];
    const maxCount = Math.max(...Object.values(beforeCounts), ...Object.values(afterCounts), 1);

    let html = '<div class="mb-3">';
    allTags.forEach(tag => {
      const bCount = beforeCounts[tag] || 0;
      const aCount = afterCounts[tag] || 0;
      const bPct = Math.round((bCount / maxCount) * 100);
      const aPct = Math.round((aCount / maxCount) * 100);

      html += `<div class="mb-3">
        <div class="fw-bold small mb-1">${tag}</div>
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="badge bg-primary" style="min-width: 50px;">導入</span>
          <div class="progress flex-grow-1" style="height: 20px;">
            <div class="progress-bar bg-primary" style="width: ${bPct}%">${bCount}人</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-danger" style="min-width: 50px;">振返り</span>
          <div class="progress flex-grow-1" style="height: 20px;">
            <div class="progress-bar bg-danger" style="width: ${aPct}%">${aCount}人</div>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
    return html;
  }

  function renderRankingTeacherView(beforeLogs, afterLogs, opts) {
    const calcScores = (logs) => {
      const scores = {};
      logs.forEach(l => {
        let val = l.value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        if (val && val.items) {
          val.items.forEach((item, idx) => {
            if (!scores[item]) scores[item] = 0;
            scores[item] += Math.max(val.items.length - idx, 1);
          });
        }
      });
      return Object.entries(scores).sort((a, b) => b[1] - a[1]);
    };

    const beforeScores = calcScores(beforeLogs);
    const afterScores = calcScores(afterLogs);
    const maxScore = Math.max(
      beforeScores.length > 0 ? beforeScores[0][1] : 0,
      afterScores.length > 0 ? afterScores[0][1] : 0,
      1
    );

    const renderRankList = (scores, label, color) => {
      let html = `<h6 class="fw-bold text-${color} small mb-2">${label}</h6>`;
      scores.forEach(([item, score], idx) => {
        const pct = Math.round((score / maxScore) * 100);
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
        html += `<div class="d-flex align-items-center mb-1">
          <span class="me-2" style="min-width: 24px;">${medal}</span>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between small"><span>${item}</span><span class="text-muted">${score}pt</span></div>
            <div class="progress" style="height: 4px;">
              <div class="progress-bar bg-${color}" style="width: ${pct}%"></div>
            </div>
          </div>
        </div>`;
      });
      return html;
    };

    return `<div class="row">
      <div class="col-6">${renderRankList(beforeScores, '導入', 'primary')}</div>
      <div class="col-6">${renderRankList(afterScores, '振り返り', 'danger')}</div>
    </div>`;
  }

  function renderCurveTeacherChart(beforeLogs, afterLogs, opts) {
    const ctx = document.getElementById('teacher-curve-chart');
    if (!ctx) return;

    const scenes = opts.scenes || ['はじめ', '展開', '山場', '結末'];
    const parseData = (logs) => {
      const sums = new Array(scenes.length).fill(0);
      let count = 0;
      logs.forEach(l => {
        let val = l.value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        if (val && val.data) {
          val.data.forEach((d, i) => { if (i < sums.length) sums[i] += d.value; });
          count++;
        }
      });
      return count > 0 ? sums.map(s => Math.round(s / count)) : sums;
    };

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: scenes,
        datasets: [
          { label: '導入（平均）', data: parseData(beforeLogs), borderColor: 'rgba(26, 115, 232, 0.8)', borderWidth: 3, tension: 0.3, fill: false, pointRadius: 4 },
          { label: '振り返り（平均）', data: parseData(afterLogs), borderColor: 'rgba(234, 67, 53, 0.8)', borderWidth: 3, tension: 0.3, fill: false, pointRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: 0, max: 100 } },
        plugins: { legend: { position: 'top' } },
        animation: false
      }
    });
  }

  function renderMandalaTeacherView(beforeLogs, afterLogs) {
    const collectWords = (logs) => {
      const counts = {};
      logs.forEach(l => {
        let val = l.value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        if (val && val.items) {
          val.items.filter(v => v && v.trim()).forEach(item => {
            counts[item.trim()] = (counts[item.trim()] || 0) + 1;
          });
        }
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    };

    const beforeWords = collectWords(beforeLogs);
    const afterWords = collectWords(afterLogs);

    const renderCloud = (words, label, color) => {
      let html = `<h6 class="fw-bold text-${color} small mb-2">${label}</h6>`;
      html += '<div class="d-flex flex-wrap gap-1 mb-3">';
      words.slice(0, 15).forEach(([word, count]) => {
        const size = count >= 3 ? 'fs-6 px-2' : 'small px-1';
        html += `<span class="badge bg-${color} bg-opacity-75 ${size}">${word}<sup>${count}</sup></span>`;
      });
      html += '</div>';
      return html;
    };

    return `<div class="row">
      <div class="col-6">${renderCloud(beforeWords, '導入', 'primary')}</div>
      <div class="col-6">${renderCloud(afterWords, '振り返り', 'danger')}</div>

  }

  function renderActionTeacherView(beforeLogs, afterLogs) {
    const renderCards = (logs, label, color) => {

      logs.forEach(l => {
        let val = l.value;
        try { if (typeof val === 'string') val = JSON.parse(val); } catch (e) { }
        if (val && typeof val === 'object') {
          html += `<div class="card mb-1 border-start border-2 border-${color}">

      <div class="col-6">${renderCards(afterLogs, '振り返り', 'danger')}</div>

  function loadScatterData() {
    if (!currentSession) return;

    const type = currentSession.inputType;
    const useScatter = (type === 'SLIDER' || type === 'QUADRANT');

    // チャートコンテナの切り替え
    const scatterContainer = document.getElementById('chart-scatter-container');
    const patternContainer = document.getElementById('chart-pattern-container');
    if (scatterContainer) scatterContainer.classList.toggle('d-none', !useScatter);
    if (patternContainer) patternContainer.classList.toggle('d-none', useScatter);

    runGoogleScript('getSessionLogs', currentSession.id)
      .then(logs => {
        if (!useScatter) {
          // パターン別可視化
          renderTeacherPatternView(logs);
          return;
        }

        if (!scatterChart) return;

        // 散布図: SLIDER / QUADRANT
        const isQuad = type === 'QUADRANT';
        if (isQuad) {
          scatterChart.options.scales.x.min = -100;
          scatterChart.options.scales.x.max = 100;
          scatterChart.options.scales.y.display = true;
          scatterChart.options.scales.y.min = -100;
          scatterChart.options.scales.y.max = 100;
          scatterChart.options.scales.x.title.text = '';
        } else {
          scatterChart.options.scales.x.min = 0;
          scatterChart.options.scales.x.max = 100;
          scatterChart.options.scales.y.display = false;
          scatterChart.options.scales.y.min = 0;
          scatterChart.options.scales.y.max = 10;

          // ラベル設定
          let opts = {};
          try { opts = typeof currentSession.options === 'string' ? JSON.parse(currentSession.options) : (currentSession.options || {}); } catch (e) { }
          scatterChart.options.scales.x.title.text = `${opts.minLabel || 'A'} ← → ${opts.maxLabel || 'B'}`;
        }

        const beforeData = [];
        const afterData = [];

        logs.forEach(l => {
          let x, y;

          if (isQuad) {
            try {
              const coord = JSON.parse(l.value);
              x = Number(coord.x);
              y = Number(coord.y);
            } catch (e) { x = 0; y = 0; }
          } else {
            x = Number(l.value) || 0;
            y = (simpleHash(l.logId || l.studentId || '') % 90) / 10 + 0.5;
          }

          const point = { x: x, y: y, text: l.text };

          if (l.phase === 'AFTER') {
            afterData.push(point);
          } else {
            beforeData.push(point);
          }
        });

        scatterChart.data.datasets[0].data = beforeData;
        scatterChart.data.datasets[1].data = afterData;
        scatterChart.update();
      })
      .catch(console.error);
  }

  /**
   * パターン別に変容サマリーの値をフォーマット
   */
  function formatSummaryValue(type, value, text, color) {
    let val = value;
    try { if (typeof val === 'string' && (val.startsWith('{') || val.startsWith('['))) val = JSON.parse(val); } catch (e) { }

    let badge = '';
    if (type === 'SLIDER') {
      badge = `<span class="badge bg-${color} me-1">${value}</span>`;
    } else if (type === 'TAGS') {
      badge = `<span class="badge bg-${color} me-1">${value}</span>`;
    } else if (type === 'QUADRANT') {
      const coord = (typeof val === 'object') ? val : {};
      badge = `<span class="badge bg-${color} me-1">x:${coord.x || 0} y:${coord.y || 0}</span>`;
    } else if (type === 'RANKING') {
      const top = val?.items?.[0] || '-';
      badge = `<span class="badge bg-${color} me-1">1位: ${top}</span>`;
    } else if (type === 'CURVE') {
      badge = `<span class="badge bg-${color} me-1">心情曲線</span>`;
    } else if (type === 'MANDALA') {
      const count = val?.items ? val.items.filter(v => v).length : 0;
      badge = `<span class="badge bg-${color} me-1">${count}個のキーワード</span>`;
    } else if (type === 'ACTION') {
      const what = val?.what || '';
      badge = `<span class="badge bg-${color} me-1">宣言</span><span class="fw-bold">${what}</span>`;
    } else {
      badge = `<span class="badge bg-${color} me-1">${value}</span>`;
    }
    return `${badge} ${text || ''}`;
  }

  // --- 単元別履歴 ---
  function exportCsv() {
    const select = document.getElementById('history-session-select');
    const sessionId = select ? select.value : '';
    if (!sessionId) {
      Swal.fire('授業を選んでください', '', 'warning');
      return;
    }
    Swal.fire({ title: 'CSV生成中...', didOpen: () => Swal.showLoading() });
    runGoogleScript('exportSessionCsv', sessionId).then(result => {
      Swal.close();
      if (!result || !result.success) {
        Swal.fire('エクスポート失敗', result ? result.error : '', 'error');
        return;
      }
      // BOM付きUTF-8でCSVダウンロード
      const bom = '\uFEFF';
      const blob = new Blob([bom + result.csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${result.title || '授業データ'}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).catch(err => {
      Swal.close();
      showError(err);
    });
  }

      .then(res => {

  function copyObservation() {

      navigator.clipboard.writeText(text).then(() => {
        Swal.fire({ icon: 'success', title: 'コピーしました', timer: 1000, showConfirmButton: false });
      }).catch(() => {
        textarea.select();
        document.execCommand('copy');

  function importUnitFromPdf() {
    const fileInput = document.getElementById('pdf-file-input');
    if (fileInput.files.length === 0) {
      Swal.fire('PDFファイルを選択してください', '', 'warning');
      return;
    }

    const file = fileInput.files[0];
    if (file.type !== 'application/pdf') {
      Swal.fire('PDFファイルのみ対応しています', '', 'error');
      return;
    }

    // ファイルサイズチェック (例: 5MB以下)
    if (file.size > 5 * 1024 * 1024) {
      Swal.fire('ファイルサイズが大きすぎます (5MB以下)', '', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = function (e) {
      const base64 = e.target.result.split(',')[1]; // data:application/pdf;base64,.....

      Swal.fire({
        title: 'AI解析中...',
        text: 'PDFから授業設定を読み取っています',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      runGoogleScript('parseLessonPdf', base64)
        .then(result => {
          if (result && result.success && result.data) {
            Swal.close();
            // フォームに反映
            const d = result.data;

            // Case 1: Multiple Units (Bulk)
            if (d.units && Array.isArray(d.units) && d.units.length > 0) {
              showBulkImportModal(d.units);
              fileInput.value = '';
              return;
            }

            // Case 2: Single Unit (Fallback)
            const unit = (d.units && d.units.length === 1) ? d.units[0] : d;
            fillUnitForm(unit);

            Swal.fire({
              icon: 'success',
              title: '読み取り成功',
              text: '内容を確認・修正して「保存する」を押してください'
            });

            // ファイル選択リセット
            fileInput.value = '';
          } else {
            throw new Error(result.error || '解析に失敗しました');
          }
        })
        .catch(showError);
    };

    reader.onerror = function () {
      Swal.fire('ファイルの読み込みに失敗しました', '', 'error');
    };

    reader.readAsDataURL(file);
  }

  function editUnit(unitId) {
    const u = cachedUnits.find(x => x.unitId === unitId);
    if (!u) {
      // Fallback: fetch from server if cache is empty
      runGoogleScript('getUnits').then(units => {
        cachedUnits = units || [];
        const found = cachedUnits.find(x => x.unitId === unitId);
        if (found) editUnit(unitId);
      });
      return;
    }

    // Populate form fields
    document.getElementById('edit-unit-id').value = u.unitId;
    document.getElementById('edit-unit-title').value = u.title;
    document.getElementById('edit-unit-type').value = u.inputType;
    document.getElementById('edit-unit-memo').value = u.memo || '';

    toggleUnitEditOptions();

    const opts = u.options || {};
    // Reset all option fields first
    document.getElementById('edit-unit-min').value = '';
    document.getElementById('edit-unit-max').value = '';
    document.getElementById('edit-unit-tags').value = '';
    document.getElementById('edit-unit-quad-xmin').value = '';
    document.getElementById('edit-unit-quad-xmax').value = '';
    document.getElementById('edit-unit-quad-ymin').value = '';
    document.getElementById('edit-unit-quad-ymax').value = '';
    document.getElementById('edit-unit-ranking-items').value = '';
    document.getElementById('edit-unit-curve-scenes').value = '';
    document.getElementById('edit-unit-mandala-theme').value = '';

    if (u.inputType === 'SLIDER') {
      document.getElementById('edit-unit-min').value = opts.minLabel || '';
      document.getElementById('edit-unit-max').value = opts.maxLabel || '';
    } else if (u.inputType === 'TAGS') {
      document.getElementById('edit-unit-tags').value = (opts.tags || []).join(',');
    } else if (u.inputType === 'QUADRANT') {
      document.getElementById('edit-unit-quad-xmin').value = opts.xAxisLabel?.[0] || '';
      document.getElementById('edit-unit-quad-xmax').value = opts.xAxisLabel?.[1] || '';
      document.getElementById('edit-unit-quad-ymin').value = opts.yAxisLabel?.[0] || '';
      document.getElementById('edit-unit-quad-ymax').value = opts.yAxisLabel?.[1] || '';
    } else if (u.inputType === 'RANKING') {
      document.getElementById('edit-unit-ranking-items').value = (opts.items || []).join(',');
    } else if (u.inputType === 'CURVE') {
      document.getElementById('edit-unit-curve-scenes').value = (opts.scenes || []).join(',');
    } else if (u.inputType === 'MANDALA') {
      document.getElementById('edit-unit-mandala-theme').value = opts.centerTheme || '';
    }

    // Update UI to edit mode
    const header = document.getElementById('unit-form-header');
    if (header) header.innerHTML = '<i class="bi bi-pencil-square me-1 text-primary"></i>編集中: <span class="text-primary">' + u.title + '</span>';
    const saveBtn = document.getElementById('btn-save-unit');
    if (saveBtn) saveBtn.innerHTML = '<i class="bi bi-check-lg me-1"></i>更新';
    const cancelBtn = document.getElementById('btn-cancel-edit');
    if (cancelBtn) cancelBtn.classList.remove('d-none');
    const card = document.getElementById('unit-edit-card');
    if (card) card.classList.add('border-primary');

    // Highlight selected unit in the list
    document.querySelectorAll('#unit-list-container .list-group-item').forEach(el => {
      const isThis = el.id === 'unit-item-' + unitId;
      el.classList.toggle('active', isThis);
      const h6 = el.querySelector('h6');
      if (h6) h6.classList.toggle('text-primary', !isThis);
      const small = el.querySelector('small');
      if (small) small.classList.toggle('text-muted', !isThis);
      const editBtn = el.querySelector('.btn-outline-primary, .btn-light');
      if (editBtn) {
        editBtn.classList.toggle('btn-light', isThis);
        editBtn.classList.toggle('btn-outline-primary', !isThis);
      }
    });

    // Scroll form into view on mobile
    if (window.innerWidth < 768) {
      const editCard = document.getElementById('unit-edit-card');
      if (editCard) editCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

  function saveUnitForm() {
    const id = document.getElementById('edit-unit-id').value;
    const title = document.getElementById('edit-unit-title').value;
    if (!title) { Swal.fire('タイトルを入力してください', '', 'warning'); return; }

    const type = document.getElementById('edit-unit-type').value;
    let options = {};

    if (type === 'SLIDER') {
      options = {
        minLabel: document.getElementById('edit-unit-min').value || 'A',
        maxLabel: document.getElementById('edit-unit-max').value || 'B'
      };
    } else if (type === 'TAGS') {
      const tVal = document.getElementById('edit-unit-tags').value;
      options = { tags: tVal ? tVal.split(/[,、，]/).map(t => t.trim()) : ['共感', '疑問', '納得', '驚き'] };
    } else if (type === 'QUADRANT') {
      options = {
        xAxisLabel: [
          document.getElementById('edit-unit-quad-xmin').value || '左',
          document.getElementById('edit-unit-quad-xmax').value || '右'
        ],
        yAxisLabel: [
          document.getElementById('edit-unit-quad-ymin').value || '下',
          document.getElementById('edit-unit-quad-ymax').value || '上'
        ]
      };
    } else if (type === 'RANKING') {
      const rVal = document.getElementById('edit-unit-ranking-items').value;
      options = { items: rVal ? rVal.split(/[,、，]/).map(t => t.trim()) : ['項目A', '項目B', '項目C'] };
    } else if (type === 'CURVE') {
      const cVal = document.getElementById('edit-unit-curve-scenes').value;
      options = { scenes: cVal ? cVal.split(/[,、，]/).map(t => t.trim()) : ['はじめ', '展開', '山場', '結末'] };
    } else if (type === 'MANDALA') {
      options = { centerTheme: document.getElementById('edit-unit-mandala-theme').value || 'テーマ' };
    } else if (type === 'ACTION') {
      options = {};
    }

    const memo = document.getElementById('edit-unit-memo').value;

    const payload = {
      unitId: id,
      title: title,
      inputType: type,
      options: options,
      memo: memo
    };

    const isUpdate = !!id;
    Swal.fire({ title: isUpdate ? '更新中...' : '保存中...', didOpen: () => Swal.showLoading() });

    runGoogleScript('saveUnit', payload)
      .then(() => {
        Swal.fire({ icon: 'success', title: isUpdate ? '更新しました' : '保存しました', timer: 1000, showConfirmButton: false });
        clearUnitForm();
        loadUnits();
      })
      .catch(showError);
  }

  function deleteUnit(event, unitId) {
    event.stopPropagation();
    event.preventDefault();

    Swal.fire({
      title: '本当に削除しますか？',
      text: 'この操作は元に戻せません',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      confirmButtonText: '削除する',
      cancelButtonText: 'キャンセル'
    }).then(result => {
      if (!result.isConfirmed) return;

      runGoogleScript('deleteUnit', unitId)
        .then(() => {
          // Clear form if the deleted unit was being edited
          const editingId = document.getElementById('edit-unit-id').value;
          if (editingId === unitId) clearUnitForm();
          loadUnits();
        })
        .catch(showError);
    });
  }

  function runGoogleScript(funcName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
      [funcName](...args);
    });
  }


  /**
   * SPA Navigation (No Reload)
   */
  function resetApp() {
    // 状態クリア
    currentUser = null;
    currentSession = null;
    currentPhase = 'BEFORE';
    isAutoLogin = false;
    isSubmitting = false;
    if (scatterChart) {
      scatterChart.destroy();
      scatterChart = null;
    }

    // UI初期化
    document.getElementById('loading').classList.remove('d-none');
    const allViews = document.querySelectorAll('[id^="view-"]');
    allViews.forEach(el => el.classList.add('d-none'));

    // データ再取得
    // イベントリスナー等はそのまま再利用
    // dispatchEventと同等の処理をDOMContentLoadedのコールバック直下から抽出して関数化すべきだが、
    // ここでは簡易的にDOMContentLoadedの中身相当を再実行する形をとるか、
    // あるいは reload の代わりに init 処理を呼ぶ。

    // 既存のDOMContentLoadedロジックを関数化していないため、
    // 簡易的にlocation.reload()の代替として初期化ロジックを走らせる。
    // ただし、EventListenerは二重登録しないように注意が必要。

    // ここでは主要な初期化フローを再実行する
    initAppFlow();
  }

  // 既存のDOMContentLoadedを関数に切り出し
  function initAppFlow() {
    // 1. 先生モード判定
    const isTeacher = localStorage.getItem('isTeacher') === 'true';
    const loader = document.getElementById('loading');
    if (loader) loader.classList.remove('d-none');

    if (isTeacher) {
      showView('view-teacher');
    }

    // 3. データ取得開始
    runGoogleScript('getInitialData')
      .then(response => {
        if (loader) loader.classList.add('d-none');

        if (!response || !response.success) {
          throw new Error(response ? response.error : 'データ取得失敗');
        }

        const data = response;

        // 先生ならロジック終了
        if (isTeacher) {
          // サーバー側で先生と認められていない場合は、名簿や記録は返ってきません
          if (!data.isTeacher) {
            Swal.fire({
              icon: 'warning',
              title: '先生として登録されていません',
              html: '<p class="small">名簿や記録を見るには、スクリプトプロパティ <code>TEACHER_EMAILS</code> にご自身のメールアドレスを登録するか、スクリプトエディタで <code>manualSetup</code> を実行してください。</p>'
            });
          }
          if (data.activeSession) {
            currentSession = data.activeSession;
            updatePhaseButtons(currentSession.phase || 'BEFORE');
          } else {
            currentSession = null;
            updatePhaseButtons('CLOSED');
          }
          renderRoster(data.users);
          initChart();
          loadScatterData();
          checkGeminiStatus();
          return;
        }

        // === 生徒用ロジック ===

        // メール自動ログイン判定
        const autoStudent = data.autoLoginStudent;

        // ドロップダウンに名簿をセット（フォールバック用）
        // ※プライバシー保護のため、名簿全件は先生にしか返ってきません。
        //   児童の画面では、Googleアカウントによる自動ログインを使います。
        const select = document.getElementById('student-select');
        if (data.users && Array.isArray(data.users) && data.users.length > 0) {
          select.innerHTML = '<option value="" selected disabled>ここをタップして選ぶ</option>';
          data.users.forEach(u => {
            const option = document.createElement('option');
            option.value = u.id;
            option.innerHTML = `${u.name} <small>(${u.ruby})</small>`;
            select.appendChild(option);
          });
        } else if (data.rosterHidden) {
          select.innerHTML = '<option value="" selected disabled>名前のリストは表示されません</option>';
          select.disabled = true;
          if (!document.getElementById('roster-hidden-hint')) {
            const hint = document.createElement('div');
            hint.id = 'roster-hidden-hint';
            hint.className = 'alert alert-warning small mb-3';
            hint.textContent = '学校のGoogleアカウントでログインすると、自動で自分の名前になります。名前が出てこないときは先生に伝えてください。';
            select.parentNode.insertBefore(hint, select.nextSibling);
          }
        }

        // セッション情報のセットアップ
        if (data.activeSession) {
          currentSession = data.activeSession;
          currentPhase = currentSession.phase || 'BEFORE';
          setupSessionUI(currentSession);

          const phaseLabels = { BEFORE: '今の考えを教えてね', AFTER: '振り返りの時間です' };
          const phaseLabel = document.getElementById('phase-label');
          if (phaseLabel && phaseLabels[currentPhase]) {
            phaseLabel.innerHTML = phaseLabels[currentPhase];
          }
        }

        // --- 自動ログイン処理 ---
        if (autoStudent) {
          isAutoLogin = true;
          localStorage.setItem('studentId', autoStudent.id);

          // 自動ログインメッセージを表示
          const autoMsg = document.getElementById('auto-login-msg');
          const manualForm = document.getElementById('manual-login-form');
          const autoName = document.getElementById('auto-login-name');
          if (autoMsg) autoMsg.classList.remove('d-none');
          if (manualForm) manualForm.classList.add('d-none');
          if (autoName) autoName.textContent = autoStudent.name;

          showView('view-login');

          // 少しだけ表示してから自動遷移
          setTimeout(() => {
            login(autoStudent.id);
          }, 800);
          return;
        }

        // --- フォールバック: 手動ログイン ---
        isAutoLogin = false;
        const autoMsg = document.getElementById('auto-login-msg');
        const manualForm = document.getElementById('manual-login-form');
        if (autoMsg) autoMsg.classList.add('d-none');
        if (manualForm) manualForm.classList.remove('d-none');

        // localStorage からの復元
        const storedUid = localStorage.getItem('studentId');
        if (storedUid) {
          currentUser = { id: storedUid };
        }

        if (currentSession) {
          if (storedUid) {
            if (currentPhase === 'AFTER') {
              showReflectionView();
            } else {
              showView('view-entry');
            }
          } else {
            showView('view-login');
          }
        } else {
          if (storedUid) {
            showView('view-waiting');
          } else {
            showView('view-login');
          }
        }
      })
      .catch(err => {
        if (loader) loader.classList.add('d-none');
        console.error(err);
        Swal.fire({
          icon: 'error',
          title: '通信エラー',
          text: '再読み込みしますか？',
          showCancelButton: true,
          confirmButtonText: '再読み込み',
        }).then((result) => {
          if (result.isConfirmed) {
            resetApp();
          }
        });
      });
  }



  // ==========================================
  // Bulk Import Functions
  // ==========================================

  function fillUnitForm(d) {
    document.getElementById('edit-unit-id').value = ''; // 新規扱い
    document.getElementById('edit-unit-title').value = d.title || '';
    document.getElementById('edit-unit-type').value = d.inputType || 'SLIDER';
    document.getElementById('edit-unit-memo').value = d.memo || '';

    toggleUnitEditOptions();

    if (d.inputType === 'SLIDER' && d.options) {
      document.getElementById('edit-unit-min').value = d.options.minLabel || '';
      document.getElementById('edit-unit-max').value = d.options.maxLabel || '';
    } else if (d.inputType === 'TAGS' && d.options && d.options.tags) {
      document.getElementById('edit-unit-tags').value = Array.isArray(d.options.tags) ? d.options.tags.join(',') : d.options.tags;
    }
  }

  let bulkUnitsCache = [];

  function showBulkImportModal(units) {
    bulkUnitsCache = units;
    const list = document.getElementById('bulk-import-list');
    list.innerHTML = '';

    units.forEach((u, idx) => {
      const isChecked = true;
      const typeLabel = u.inputType === 'SLIDER' ? '<span class="badge bg-primary">スライダー</span>' : '<span class="badge bg-success">感情タグ</span>';

      const html = `
      <label class="list-group-item d-flex gap-2">
        <input class="form-check-input flex-shrink-0" type="checkbox" value="${idx}" ${isChecked ? 'checked' : ''} style="transform: scale(1.3); margin-top: 0.3em;">
        <div class="flex-grow-1 ms-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="mb-0 fw-bold">${u.title || '（タイトルなし）'}</h6>
            ${typeLabel}
          </div>
          <small class="text-muted text-truncate d-block" style="max-width: 100%;">${u.memo || ''}</small>
        </div>
      </label>
    `;
      list.innerHTML += html;
    });

    const modal = new bootstrap.Modal(document.getElementById('bulkImportModal'));
    modal.show();
  }

  function saveBulkUnits() {
    const checkboxes = document.querySelectorAll('#bulk-import-list input[type="checkbox"]:checked');
    if (checkboxes.length === 0) {
      Swal.fire('登録する単元を選択してください', '', 'warning');
      return;
    }

    const selectedUnits = Array.from(checkboxes).map(cb => bulkUnitsCache[parseInt(cb.value)]);
    const modal = bootstrap.Modal.getInstance(document.getElementById('bulkImportModal'));
    modal.hide();

    Swal.fire({
      title: '一括登録中...',
      text: `${selectedUnits.length}件の単元を登録しています`,
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    saveNextUnit(selectedUnits, 0);
  }

  function saveNextUnit(units, index) {
    if (index >= units.length) {
      Swal.fire({ icon: 'success', title: '完了', text: `${units.length}件を登録しました` });
      loadUnits();
      return;
    }

    const u = units[index];
    const payload = {
      unitId: '',
      title: u.title,
      inputType: u.inputType,
      options: u.options,
      memo: u.memo
    };

    runGoogleScript('saveUnit', payload)
      .then(() => {
        saveNextUnit(units, index + 1);
      })
      .catch(err => {
        console.error(err);
        Swal.fire('エラー', `${index + 1}件目の登録に失敗しました: ${u.title}`, 'error');
      });
  }
</script>
