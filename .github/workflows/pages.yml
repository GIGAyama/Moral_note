# GitHub Pages への配信
#
# なぜ要るのか：
#   独自ドメイン（CNAME）と DNS は用意されているのに、このリポジトリでは
#   Pages が一度も有効化されていなかった。そのため GitHub 側に
#   moral-note.giga-school.com を担当するサイトが存在せず、
#   ブラウザは「この接続ではプライバシーが保護されません」
#   （ERR_CERT_COMMON_NAME_INVALID）を出していた。
#
#   configure-pages の enablement: true が、その有効化を肩代わりする。
#   配信物に CNAME を含めるので、有効化と同時にカスタムドメインが
#   登録され、証明書の発行がはじまる。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走り始めたデプロイは止めない。並行実行だけ避ける。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages が無効なら有効化する（既に有効なら何もしない）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # リポジトリのルートをそのまま配信する（ブランチ配信と同じ中身）。
      # CNAME もここに含まれるので、カスタムドメインが登録される。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
