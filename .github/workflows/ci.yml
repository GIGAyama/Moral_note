# =====================================================================
# ci.yml — このリポジトリの最低限の点検
# =====================================================================
# このリポジトリは GAS の .gs と、GAS テンプレートの .html でできている。
# 機械で見ておきたいのは次の2つ:
#
#   1. check  — npm run check。.gs の構文、GAS へ送るファイルの配線、
#      公開エンドポイントの数、appsscript.json、案内ページ、そして
#      シートの点検・修整のテスト（tests/）。
#      **deploy.yml が本番へ反映する前に回すのと同じ指示**なので、
#      ここが緑なら反映も止まらない。
#   2. drift  — Gemini.gs などが正本（GIGAyama.github.io/standards/gas/）から
#      ずれていないか。正本を直したのにこのコピーだけ古いまま、を防ぐ。
#
# .html は GAS のテンプレート（<?= ?> を含みうる）なので構文検査の対象外。
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存パッケージは無い（scripts/ も tests/ も Node の標準機能だけで動く）。
      # npm ci を回さないのは、入れるものが何も無いから。
      - name: 点検（構文・配線・公開関数・案内ページ・シートのテスト）
        run: npm run check

  # 生成物が原本と食い違っていないか。
  # ライブラリを自己ホストにしたので、原本（vendor.config.json / src/app.jsx など）を
  # 直したのに npm run build を忘れると、リポジトリの中身だけが古いまま残る。
  # 構文検査もスキル照合も通ってしまい、貼り付けて動かすまで気づけない。
  #
  # ⚠️ 検査はコミットされている中身と比べる。前に build を走らせても結果は変わらない
  #    （作業ツリーと比べていたころは、build を先に置くだけで必ず緑になった）。
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成物が原本と一致しているか
        run: npm run ci

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
