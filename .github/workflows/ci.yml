# =====================================================================
# ci.yml — このリポジトリの最低限の点検
# =====================================================================
# このリポジトリは GAS の .gs と、GAS テンプレートの .html だけでできて
# いて、ビルドもテストも持たない。それでも次の2つは機械で見ておきたい:
#
#   1. syntax — .gs が構文として壊れていないか。GAS は貼り付けて保存する
#      まで誤りに気づけないので、その前に落とす。
#   2. drift  — Gemini.gs が正本（GIGAyama.github.io/standards/gas/）から
#      ずれていないか。正本を直したのにこのコピーだけ古いまま、を防ぐ。
#
# .html は GAS のテンプレート（<?= ?> を含みうる）なので構文検査の対象外。
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: .gs の構文検査
        run: |
          set -e
          fail=0
          # node は .gs 拡張子を知らないので、.js として写してから見る
          for f in *.gs; do
            [ -e "$f" ] || continue
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js" || fail=1
          done
          exit $fail

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
